# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: scam-alert-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers makes rate limiting see the real client IP behind Render's proxy.
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      # Free instances lose their disk on restart; refill demo data automatically.
      - key: SEED_DEMO_IF_EMPTY
        value: "true"
