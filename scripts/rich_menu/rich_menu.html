<!doctype html>
<!-- Source for rich_menu.png (2500x1686). Render at 1250x843 with device scale 2 and screenshot. -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1250px; height: 843px; overflow: hidden; background: #fff; }
    body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 6px;
      font-family: "Sarabun", sans-serif;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }
    .icon { font-size: 150px; line-height: 1; }
    .title { font-size: 84px; font-weight: 800; line-height: 1.25; margin-top: 12px; }
    .sub { font-size: 40px; font-weight: 700; opacity: .92; }
    .image { background: #1E3A8A; }
    .text { background: #2F5BFF; }
    .call { background: #C62828; }
    .help { background: #2E7D32; }
  </style>
</head>
<body>
  <div class="tile image"><div class="icon">📷</div><div class="title">ส่งรูปให้ตรวจ</div><div class="sub">แคปหน้าจอแล้วส่งมา</div></div>
  <div class="tile text"><div class="icon">✍️</div><div class="title">ตรวจข้อความ</div><div class="sub">คัดลอกข้อความมาวาง</div></div>
  <div class="tile call"><div class="icon">📞</div><div class="title">โทร 1441</div><div class="sub">ปรึกษาฟรี 24 ชม.</div></div>
  <div class="tile help"><div class="icon">❓</div><div class="title">วิธีใช้</div><div class="sub">ดูวิธีใช้ง่ายๆ</div></div>
</body>
</html>
